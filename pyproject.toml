[project]
name = "django-forge-core"
dynamic = ["version"]
description = "Socle runtime des projets Django Forge : configuration par l'environnement, modeles abstraits et erreurs typees avec pycatch."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cédric Hervé Youan", email = "hervecedricyouan@gmail.com" }]
keywords = ["django", "settings", "environment", "abstract-models", "result", "drf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.0",
    "pycatch-safe>=1.0.0rc1",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.15"]

[project.urls]
Repository = "https://github.com/alzeph/django-forge-core"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/forge_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_core"]

[dependency-groups]
dev = [
    "djangorestframework>=3.15",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["forge_core"]
branch = true
